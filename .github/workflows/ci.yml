name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # checkout otherwise writes an http.<github>.extraheader auth line
          # into .git/config using GITHUB_TOKEN, which is scoped to THIS repo.
          # That header overrides the credentials in the dependency URL, so npm
          # fetches the private shim as the wrong identity and gets 404.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The better-sqlite3 dependency is aliased to JIGGAI/kitchen-sqlite-compat,
      # a private repo. npm normalizes git deps to ssh:// in the lockfile, and
      # Actions' GITHUB_TOKEN is scoped to this repo only, so rewrite ssh to
      # https with a token that can read it.
      - name: Authorize npm to fetch the private shim
        run: |
          # 401 = token invalid/expired.  404 = token valid but cannot see the repo.
          curl -s -o /dev/null -w "shim repo access: HTTP %{http_code}\n" \
            -H "Authorization: Bearer $PAT" \
            https://api.github.com/repos/JIGGAI/kitchen-sqlite-compat
          echo -n "leftover extraheader in .git/config: "
          git config --get-all http.https://github.com/.extraheader >/dev/null 2>&1 && echo PRESENT || echo none
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          PAT: ${{ secrets.RELEASE_PAT }}

      - run: npm ci

      - name: Build
        run: npm run build
