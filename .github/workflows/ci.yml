name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The better-sqlite3 dependency is aliased to JIGGAI/kitchen-sqlite-compat,
      # a private repo. npm normalizes git deps to ssh:// in the lockfile, and
      # Actions' GITHUB_TOKEN is scoped to this repo only, so rewrite ssh to
      # https with a token that can read it.
      - name: Authorize npm to fetch the private shim
        run: |
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          PAT: ${{ secrets.RELEASE_PAT }}

      - run: npm ci

      - name: Build
        run: npm run build
