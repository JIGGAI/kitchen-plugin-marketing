name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The better-sqlite3 dependency is aliased to JIGGAI/kitchen-sqlite-compat,
      # a private repo. npm normalizes git deps to ssh:// in the lockfile, and
      # Actions' GITHUB_TOKEN is scoped to this repo only, so rewrite ssh to
      # https with a token that can read it.
      - name: Authorize npm to fetch the private shim
        run: |
          # 401 = token invalid/expired.  404 = token valid but cannot see the repo.
          curl -s -o /dev/null -w "shim repo access: HTTP %{http_code}\n" \
            -H "Authorization: Bearer $PAT" \
            https://api.github.com/repos/JIGGAI/kitchen-sqlite-compat
          # /repos/{o}/{r} needs only Metadata, which fine-grained PATs always
          # have -- so a 200 there does NOT prove git access. Contents:Read is
          # what git clone actually requires.
          curl -s -o /dev/null -w "contents perm:    HTTP %{http_code}\n" \
            -H "Authorization: Bearer $PAT" \
            https://api.github.com/repos/JIGGAI/kitchen-sqlite-compat/contents/package.json
          echo -n "git via x-access-token: "
          git ls-remote "https://x-access-token:${PAT}@github.com/JIGGAI/kitchen-sqlite-compat.git" >/dev/null 2>&1 && echo OK || echo FAIL
          echo -n "git via bare token:     "
          git ls-remote "https://${PAT}@github.com/JIGGAI/kitchen-sqlite-compat.git" >/dev/null 2>&1 && echo OK || echo FAIL
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          PAT: ${{ secrets.RELEASE_PAT }}

      - run: npm ci

      - name: Build
        run: npm run build
